context:
  version: "0.37.1"

package:
  name: sendme
  version: ${{ version }}

source:
  url: https://github.com/n0-computer/sendme/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c06c3c250bca80c9bcac4650c8e4eb8db6e0b28261bacebac1df0c93b674e62a

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # Ring's C/asm code requires clang-cl (not MSVC cl.exe) when targeting
      # aarch64-pc-windows-msvc. These vars are only consulted by cargo / cc-rs
      # when CARGO_BUILD_TARGET is that triple, so they are inert elsewhere.
      CC_aarch64_pc_windows_msvc: clang-cl
      AR_aarch64_pc_windows_msvc: llvm-lib
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: lld-link
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - if: target_platform == "win-arm64"
            then:
              - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path . --target aarch64-pc-windows-msvc
            else:
              - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: target_platform == "win-arm64"
      then:
        - clang
        - lld

tests:
  - script: sendme --help
  - package_contents:
      bin:
        - sendme
      strict: true

about:
  homepage: https://www.iroh.computer/sendme
  summary: A tool to send files and directories over the network, with NAT hole punching
  description: |
    sendme is a CLI tool to send files and directories over the network,
    built on the iroh peer-to-peer networking platform. It uses NAT hole
    punching to establish direct connections between peers, and iroh-blobs
    for efficient, verifiable, and resumable file transmission.
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  repository: https://github.com/n0-computer/sendme

extra:
  recipe-maintainers:
    - baszalmstra
